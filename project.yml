# XcodeGen project specification. Regenerate Lithe.xcodeproj with `make project`
# (requires `brew install xcodegen`). The generated project is gitignored; this
# file is the source of truth for targets and build settings.
name: Lithe
options:
  bundleIdPrefix: com.github.asmeurer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  Lithe:
    type: application
    platform: macOS
    sources:
      - path: Lithe
    info:
      path: Lithe/Info.plist
      properties:
        CFBundleName: Lithe
        CFBundleDisplayName: Lithe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 Aaron Meurer. MIT License.
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.asmeurer.Lithe
        PRODUCT_NAME: Lithe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Lithe/Info.plist
  LitheTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LitheTests
    dependencies:
      - target: Lithe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.asmeurer.LitheTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lithe:
    build:
      targets:
        Lithe: all
        LitheTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LitheTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
