included:
  - Lithe
  - LitheTests
disabled_rules:
  - line_length
  - todo
  - trailing_comma
  - force_try          # tests use try! with #require
  - force_unwrapping
opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - redundant_nil_coalescing
identifier_name:
  min_length: 1
  max_length: 50
file_length:
  warning: 500
  error: 800
type_body_length:
  warning: 400
  error: 600
function_body_length:
  warning: 80
  error: 150
cyclomatic_complexity:
  warning: 15
  error: 25
nesting:
  type_level: 2
